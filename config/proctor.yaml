# Proctor configuration
node_role: standalone
node_id: node-local
nats_url: nats://localhost:4222
data_dir: data
log_level: INFO

llm:
  default_model: claude-sonnet-4-20250514
  fallback_model: ollama/llama3.2
  max_tokens: 4096
  temperature: 0.7

nats:
  url: nats://localhost:4222
  connect_timeout: 5.0
  reconnect_time_wait: 2.0
  max_reconnect_attempts: 60

scheduler:
  poll_interval_seconds: 30
  enabled: true

telegram:
  bot_token: "your-bot-token"
  allowed_chat_ids: []
  poll_timeout: 30

workflows:
  chat:
    workflow_id: chat
    mode: simple
  heartbeat:
    workflow_id: heartbeat
    mode: simple

routes:
  - event_pattern: "trigger.terminal"
    workflow_id: chat
    prompt_from_payload: text
  - event_pattern: "trigger.telegram"
    workflow_id: chat
    prompt_from_payload: text
  - event_pattern: "trigger.scheduler"
    workflow_id: heartbeat
    prompt_from_payload: prompt

schedules:
  - name: heartbeat
    interval_seconds: 3600
    payload:
      prompt: "Check system status and report any anomalies"
  - name: daily-report
    cron: "0 9 * * *"
    payload:
      prompt: "Produce the daily operations report"
