# Proctor configuration
node_role: standalone
node_id: node-local
# transport: "auto" (default) resolves to "local" for standalone, "nats"
# for core/worker. Override with "local" or "nats" to force.
transport: auto
data_dir: data
log_level: INFO

llm:
  default_model: claude-sonnet-4-20250514
  fallback_model: ollama/llama3.2
  max_tokens: 4096
  temperature: 0.7

nats:
  servers:
    - nats://localhost:4222
  subject_prefix: proctor
  connect_timeout: 5.0
  reconnect_time_wait: 2.0
  reconnect_jitter: 0.5
  max_reconnect_attempts: -1

scheduler:
  poll_interval_seconds: 30
  enabled: true

telegram:
  bot_token: "your-bot-token"
  allowed_chat_ids: []
  poll_timeout: 30

webhook:
  host: 127.0.0.1
  port: 8080
  max_in_flight: 20
  max_body_bytes: 1048576
  shutdown_timeout: 30.0
  paths:
    /webhook/github:
      source_name: github
      auth:
        type: hmac
        secret_env: GITHUB_WEBHOOK_SECRET
        header: X-Hub-Signature-256
        prefix: "sha256="
    /webhook/ci:
      auth:
        type: bearer
        secret_env: PROCTOR_CI_TOKEN

workflows:
  chat:
    workflow_id: chat
    mode: simple
  heartbeat:
    workflow_id: heartbeat
    mode: simple

routes:
  - event_pattern: "trigger.terminal"
    workflow_id: chat
    prompt_from_payload: text
  - event_pattern: "trigger.telegram"
    workflow_id: chat
    prompt_from_payload: text
  - event_pattern: "trigger.scheduler"
    workflow_id: heartbeat
    prompt_from_payload: prompt
  - event_pattern: "trigger.webhook.github"
    workflow_id: chat
    prompt_from_payload: body.head_commit.message
  - event_pattern: "trigger.webhook.ci"
    workflow_id: chat
    prompt_from_payload: body.message

schedules:
  - name: heartbeat
    interval_seconds: 3600
    payload:
      prompt: "Check system status and report any anomalies"
  - name: daily-report
    cron: "0 9 * * *"
    payload:
      prompt: "Produce the daily operations report"

# TaskRouter admission (M4). Defaults shown; scope/branch are declared
# per workflow in the workflows: catalog.
# router:
#   max_concurrency: 4
#   queue_ttl_seconds: 600    # 0 = reject immediately, never queue
#   queue_tick_seconds: 30
#
# Local worker identity/capacity (replaces the old router.agent.max_slots).
# On a core/standalone node this describes the inline executor; a
# remote worker node sets node_role: worker and gives itself a
# non-"local" id + the capabilities it can satisfy:
# worker:
#   id: local
#   capabilities: []          # e.g. [shell, python]
#   max_slots: 4
#
# Worker discovery/liveness. liveness_timeout must exceed
# heartbeat_interval and is core/standalone-only (drives the sweep for
# silent workers). heartbeat_interval is also read by worker nodes for
# their own heartbeat cadence — keep a worker's value comfortably under
# the core's liveness_timeout. This is a cross-node coupling that
# per-node config validation cannot check; a mismatch causes liveness
# flapping (workers appearing to go offline and back) with task
# casualties on the affected dispatches:
# registry:
#   heartbeat_interval: 30.0
#   liveness_timeout: 90.0
#
# Container worker fleets managed by the core (Phase 3). Each fleet is a
# declared set of replicas; the core starts them, restarts on container
# exit, and stops them on shutdown. worker_id churns per launch.
# docker_workers:
#   - image: proctor:latest
#     base_worker_id: docker_py
#     capabilities: [python, shell]
#     replicas: 2
#     runtime: podman              # or docker
#     nats_servers: ["nats://host.docker.internal:4222"]  # container-facing
#     secret_env: [ANTHROPIC_API_KEY]   # forwarded via one fleet env-file
#     max_restarts: 5
#     stop_timeout: 30.0           # must be >= container's drain_timeout
#   - image: proctor:latest
#     base_worker_id: remote_gpu
#     capabilities: [python]
#     replicas: 1
#     runtime: docker
#     ssh_host: user@gpu-box:22        # [user@]host[:port], no ssh:// prefix
#     nats_servers: ["nats://10.0.0.5:4222"]  # core address routable FROM the host
#     secret_env: [ANTHROPIC_API_KEY]
#     op_timeout: 30.0                 # deadline for fast ops (kills a hung ssh)
#     max_unreachable_duration: 120.0  # then the slot is failed
